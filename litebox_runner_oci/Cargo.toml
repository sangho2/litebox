[package]
name = "litebox_runner_oci"
version = "0.1.0"
edition = "2024"
description = "OCI-compliant container runtime using LiteBox sandbox"

[dependencies]
# OCI spec parsing (just the spec, not youki's full libcontainer)
oci-spec = { version = "0.8", features = ["runtime"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# LiteBox core
litebox = { path = "../litebox" }
litebox_common_linux = { path = "../litebox_common_linux" }
litebox_platform_linux_userland = { path = "../litebox_platform_linux_userland" }
litebox_platform_multiplex = { path = "../litebox_platform_multiplex", default-features = false, features = ["platform_linux_userland", "systrap_backend"] }
litebox_shim_linux = { path = "../litebox_shim_linux" }
litebox_syscall_rewriter = { path = "../litebox_syscall_rewriter" }

# Utilities
exec = "0.3"
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.0"

[lints]
workspace = true
